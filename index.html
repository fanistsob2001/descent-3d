<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Descent</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Κατά τη διάρκεια του παιχνιδιού -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <button id="btn-pause" class="hud-btn" type="button" aria-label="Pause" data-key="Esc">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="btn-map" class="hud-btn" type="button" aria-label="Map" data-key="M">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="line" d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>
      </button>
    </div>
    <div class="hud-center">
      <div id="level-label"></div>
      <div id="strings-label"></div>
    </div>
    <div class="hud-right">
      <button id="btn-melody" class="hud-btn hidden" type="button" aria-label="Play the lyre" data-key="Q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="line" d="M7 4c-3 3-3 9 0 13h10c3-4 3-10 0-13M7 4c1 2 1 4 0 6M17 4c-1 2-1 4 0 6M6 10h12M9 10v7M12 10v7M15 10v7M8 20h8"/></svg>
        <span id="melody-count" class="count">0</span>
      </button>
      <button id="btn-jar" class="hud-btn hidden" type="button" aria-label="Throw libation jar" data-key="E">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="line" d="M9 3h6M10 3v3c-4 2-5 7-3 11l2 3h6l2-3c2-4 1-9-3-11V3M7 10h10"/></svg>
        <span id="jar-count" class="count">0</span>
      </button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="notice"></div>
  <div id="level-intro"><p id="intro-number"></p><p id="intro-name"></p><p id="intro-line"></p></div>

  <!-- Αρχικό μενού -->
  <div id="menu" class="overlay">
    <div id="menu-art" aria-hidden="true"></div>
    <div class="meander"></div>
    <h1>DESCENT</h1>
    <div class="meander"></div>
    <button id="btn-continue" class="btn" type="button" data-action="continue">Continue</button>
    <button id="btn-new" class="btn" type="button" data-action="new">New Game</button>
    <button class="btn" type="button" data-action="settings">Settings</button>
    <p class="headphones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
      Wear headphones
    </p>
    <p class="controls touch-only">Left side: move &middot; Right side: look &middot; Lyre button: sound</p>
    <p class="controls keys-only">WASD move &middot; Mouse look &middot; Left click / Space sound &middot; Right click / X cancel &middot; Shift sneak &middot; E jar &middot; Q lyre &middot; M map &middot; F fullscreen &middot; Esc pause</p>
  </div>

  <div id="settings" class="overlay hidden">
    <h2>Settings</h2>
    <div class="meander"></div>
    <button class="btn sound-toggle" type="button" data-action="sound">Sound: on</button>
    <button class="btn vibration-toggle" type="button" data-action="vibration">Vibration: on</button>
    <button class="btn mouse-toggle keys-only" type="button" data-action="mouse">Mouse: 1x</button>
    <button class="btn primary" type="button" data-action="back">Back</button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2>Paused</h2>
    <div class="meander"></div>
    <p id="pause-chapter" class="small-label"></p>
    <p id="pause-objective" class="objective"></p>
    <button class="btn primary" type="button" data-action="resume">Resume</button>
    <button class="btn sound-toggle" type="button" data-action="sound">Sound: on</button>
    <button class="btn vibration-toggle" type="button" data-action="vibration">Vibration: on</button>
    <button class="btn mouse-toggle keys-only" type="button" data-action="mouse">Mouse: 1x</button>
    <button class="btn" type="button" data-action="menu">Main menu</button>
  </div>

  <!-- Χάρτης: ο ίδιος ο χάρτης ζωγραφίζεται στο canvas (drawMap στο js/main.js) -->
  <div id="map-screen" class="overlay hidden">
    <p id="map-chapter" class="small-label"></p>
    <button class="btn primary" type="button" data-action="map-close">Back</button>
  </div>

  <!-- Cutscenes: οι γραμμές μπαίνουν από το js/cutscene.js -->
  <div id="cutscene" class="overlay cutscene hidden">
    <button id="cut-skip" type="button">Skip</button>
    <canvas id="cut-art" aria-hidden="true"></canvas>
    <div id="cut-lines"></div>
    <div class="cut-next" aria-hidden="true"></div>
  </div>

  <!-- Μετά τα τέλη (τα κείμενα των κουμπιών από το STORY.md, ενότητα 5) -->
  <div id="end-good" class="overlay end hidden">
    <div class="meander"></div>
    <button class="btn primary" type="button" data-action="menu">Main menu</button>
  </div>
  <div id="end-bad" class="overlay end hidden">
    <div class="meander"></div>
    <button class="btn primary" type="button" data-action="retry">Try again from the last checkpoint</button>
    <button class="btn" type="button" data-action="menu">Main menu</button>
  </div>

  <script src="js/pottery.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/story.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/level.js"></script>
  <script src="js/echo.js"></script>
  <script src="js/raycast.js"></script>
  <script src="js/input.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/exit.js"></script>
  <script src="js/jar.js"></script>
  <script src="js/items.js"></script>
  <script src="js/charon.js"></script>
  <script src="js/melody.js"></script>
  <script src="js/souls.js"></script>
  <script src="js/eurydice.js"></script>
  <script src="js/cutscene.js"></script>
  <script src="js/eggs.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/save.js"></script>
  <script src="js/altar.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/dread.js"></script>
  <script src="js/scare.js"></script>
  <script src="js/hands.js"></script>
  <script src="js/world3d.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
